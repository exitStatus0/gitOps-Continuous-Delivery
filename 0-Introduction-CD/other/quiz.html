let globalQIndex = 0;

function renderQuiz() {
  const container = document.getElementById('quiz');
  let html = '';
  globalQIndex = 0;

  sections.forEach((section, si) => {
    html += `<h2 class="section-title">${section.title} (${section.points} баллов)</h2>`;
    const pointsPerQ = section.points / section.questions.length;

    section.questions.forEach((q, qi) => {
      globalQIndex++;
      const qId = `q${si}_${qi}`;
      html += `<div class="question" id="${qId}_card">
        <div class="question-header">
          <span class="question-number">Вопрос ${globalQIndex}</span>
          <span class="points">${pointsPerQ} баллов</span>
        </div>
        <p class="question-text">${q.q}</p>
        <ul class="options">`;

      q.options.forEach((opt, oi) => {
        html += `<li id="${qId}_opt${oi}" onclick="selectOption('${qId}', ${oi}, ${q.options.length})">
          <label><input type="radio" name="${qId}" value="${oi}"> ${opt}</label>
        </li>`;
      });

      html += `</ul>
        <div class="explanation" id="${qId}_exp">
          <strong>${q.options[q.answer]}</strong><br>${q.explanation}
        </div>
      </div>`;
    });
  });

  container.innerHTML = html;
}

function selectOption(qId, selected, total) {
  for (let i = 0; i < total; i++) {
    document.getElementById(`${qId}_opt${i}`).classList.remove('selected');
  }
  document.getElementById(`${qId}_opt${selected}`).classList.add('selected');
  document.querySelector(`input[name="${qId}"][value="${selected}"]`).checked = true;
}

function submitQuiz() {
  let totalScore = 0;
  let maxScore = 0;
  let sectionScores = [];
  let unanswered = 0;

  sections.forEach((section, si) => {
    const pointsPerQ = section.points / section.questions.length;
    let sectionScore = 0;
    maxScore += section.points;

    section.questions.forEach((q, qi) => {
      const qId = `q${si}_${qi}`;
      const card = document.getElementById(`${qId}_card`);
      const exp = document.getElementById(`${qId}_exp`);
      const selected = document.querySelector(`input[name="${qId}"]:checked`);

      card.classList.remove('correct', 'incorrect');
      exp.classList.remove('show', 'correct-exp', 'incorrect-exp');

      if (!selected) {
        unanswered++;
        card.classList.add('incorrect');
        exp.classList.add('show', 'incorrect-exp');
        return;
      }

      const val = parseInt(selected.value);
      if (val === q.answer) {
        sectionScore += pointsPerQ;
        card.classList.add('correct');
        exp.classList.add('show', 'correct-exp');
      } else {
        card.classList.add('incorrect');
        exp.classList.add('show', 'incorrect-exp');
      }
    });

    totalScore += sectionScore;
    sectionScores.push({ title: section.title, score: sectionScore, max: section.points });
  });

  if (unanswered > 0) {
    const warn = document.getElementById('unanswered');
    warn.textContent = `${unanswered} вопрос(ов) без ответа (засчитаны как неправильные).`;
    warn.classList.add('show');
  }

  showResults(totalScore, maxScore, sectionScores);
}

function showResults(score, max, sectionScores) {
  const pct = Math.round((score / max) * 100);
  let level, levelClass, desc;

  if (pct >= 90) {
    level = 'Эксперт'; levelClass = 'score-expert';
    desc = 'Отлично! У вас превосходное понимание Continuous Delivery. Вы готовы внедрять и продвигать практики CD в своей организации.';
  } else if (pct >= 80) {
    level = 'Продвинутый'; levelClass = 'score-advanced';
    desc = 'Хорошее понимание концепций CD. Просмотрите области, в которых вы ошиблись, чтобы закрепить свои знания.';
  } else if (pct >= 70) {
    level = 'Средний'; levelClass = 'score-intermediate';
    desc = 'Хорошая основа принципов CD. Рассмотрите возможность более глубокого изучения тем, которые показались вам сложными.';
  } else if (pct >= 60) {
    level = 'Базовый'; levelClass = 'score-basic';
    desc = 'Вы понимаете основы, но вам нужно больше практики. Внимательно изучите вводные материалы.';
  } else {
    level = 'Новичок'; levelClass = 'score-beginner';
    desc = 'Найдите время, чтобы внимательно прочитать вводные материалы по Continuous Delivery. Не унывайте — CD это сложная тема!';
  }

  let breakdownHTML = '';
  sectionScores.forEach(s => {
    const sPct = Math.round((s.score / s.max) * 100);
    breakdownHTML += `<div class="breakdown-row">
      <span class="section-name">${s.title.replace(/Раздел \d+: /, '')}</span>
      <span>${s.score}/${s.max} (${sPct}%)</span>
    </div>`;
  });

  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = `
    <div class="score-circle ${levelClass}">
      ${pct}%
      <span class="label">${score}/${max}</span>
    </div>
    <div class="level-title">${level}</div>
    <p class="level-desc">${desc}</p>
    <div class="progress-bar">
      <div class="progress-fill ${levelClass}" style="width: ${pct}%; background: currentColor;"></div>
    </div>
    <div class="breakdown">
      <h3>Результаты по разделам</h3>
      ${breakdownHTML}
    </div>
  `;
  resultsDiv.classList.add('show');
  resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetQuiz() {
  document.getElementById('results').classList.remove('show');
  document.getElementById('results').innerHTML = '';
  document.getElementById('unanswered').classList.remove('show');
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuiz();
</script>
