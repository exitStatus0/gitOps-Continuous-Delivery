<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuous Delivery Quiz</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 2rem 1rem;
  }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 2rem; margin-bottom: 0.5rem; }
  .subtitle { color: var(--muted); margin-bottom: 2rem; font-size: 1.1rem; }
  .section-title {
    font-size: 1.3rem;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.5rem;
    margin: 2rem 0 1rem;
  }
  .question {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    transition: border-color 0.3s;
  }
  .question.correct { border-color: var(--green); }
  .question.incorrect { border-color: var(--red); }
  .question-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  .question-number { font-weight: 600; font-size: 1.05rem; }
  .points { color: var(--muted); font-size: 0.85rem; }
  .question-text { margin-bottom: 1rem; font-size: 1rem; }
  .options { list-style: none; }
  .options li {
    padding: 0.6rem 1rem;
    margin-bottom: 0.4rem;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.2s, border-color 0.2s;
  }
  .options li:hover { background: #1c2333; }
  .options li.selected {
    background: #1c2333;
    border-color: var(--accent);
  }
  .options input[type="radio"] { display: none; }
  .options label {
    cursor: pointer;
    display: block;
    width: 100%;
  }
  .explanation {
    margin-top: 1rem;
    padding: 1rem;
    border-radius: 6px;
    font-size: 0.95rem;
    display: none;
  }
  .explanation.show { display: block; }
  .explanation.correct-exp { background: rgba(63, 185, 80, 0.1); border: 1px solid rgba(63, 185, 80, 0.3); }
  .explanation.incorrect-exp { background: rgba(248, 81, 73, 0.1); border: 1px solid rgba(248, 81, 73, 0.3); }
  .btn {
    display: inline-block;
    padding: 0.8rem 2rem;
    font-size: 1.1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-top: 2rem;
  }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-secondary { background: var(--border); color: var(--text); margin-left: 1rem; }
  .results {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    margin-top: 2rem;
    text-align: center;
    display: none;
  }
  .results.show { display: block; }
  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 1.5rem auto;
    font-size: 2.5rem;
    font-weight: 700;
  }
  .score-circle .label { font-size: 0.8rem; font-weight: 400; color: var(--muted); }
  .score-expert { border: 4px solid var(--green); color: var(--green); }
  .score-advanced { border: 4px solid #58a6ff; color: #58a6ff; }
  .score-intermediate { border: 4px solid var(--yellow); color: var(--yellow); }
  .score-basic { border: 4px solid #f0883e; color: #f0883e; }
  .score-beginner { border: 4px solid var(--red); color: var(--red); }
  .level-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
  .level-desc { color: var(--muted); margin-bottom: 1.5rem; }
  .breakdown { text-align: left; margin-top: 1.5rem; }
  .breakdown h3 { margin-bottom: 0.75rem; font-size: 1.1rem; }
  .breakdown-row {
    display: flex;
    justify-content: space-between;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
  }
  .breakdown-row .section-name { color: var(--muted); }
  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    margin-top: 1.5rem;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.8s ease;
  }
  .unanswered-warning {
    color: var(--yellow);
    margin-top: 1rem;
    display: none;
  }
  .unanswered-warning.show { display: block; }
  .nav-links {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    font-size: 0.95rem;
  }
  .nav-links a { color: var(--accent); text-decoration: none; }
  .nav-links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h1>Continuous Delivery Quiz</h1>
  <p class="subtitle">Test your knowledge of Continuous Delivery concepts and practices. 20 questions, 100 points total.</p>

  <div id="quiz"></div>

  <div id="unanswered" class="unanswered-warning"></div>

  <button class="btn btn-primary" onclick="submitQuiz()">Show Results</button>
  <button class="btn btn-secondary" onclick="resetQuiz()">Reset</button>

  <div id="results" class="results"></div>

  <div class="nav-links">
    <a href="../../README.md">&larr; Back to Course Overview</a>
    <a href="../../1-Intrduction-GitOps/EN/IntroductionToGitOps.md">Next: Introduction to GitOps &rarr;</a>
  </div>
</div>

<script>
const sections = [
  {
    title: "Section 1: Understanding Continuous Delivery",
    points: 20,
    questions: [
      {
        q: "What is Continuous Delivery?",
        options: [
          "A tool for automating deployments",
          "The ability to get changes of all types into production safely and quickly in a sustainable way",
          "A practice focused only on deploying to production environments",
          "A replacement for manual testing"
        ],
        answer: 1,
        explanation: "This is the definition provided by Jez Humble on continuousdelivery.com. CD is not just a tool or practice, but a comprehensive approach to software delivery."
      },
      {
        q: "Continuous Delivery is best described as:",
        options: [
          "Only a technological transformation",
          "Only a cultural transformation",
          "Both a technological and cultural transformation",
          "A set of deployment tools"
        ],
        answer: 2,
        explanation: "Like DevOps, CD requires changes to both technology (tools, automation, processes) and culture (mindset, collaboration, ways of working)."
      },
      {
        q: "According to Jez Humble, Continuous Delivery includes which types of changes?",
        options: [
          "Only new features",
          "Only bug fixes",
          "New features, configuration changes, bug fixes, and experiments",
          "Only configuration changes"
        ],
        answer: 2,
        explanation: "CD encompasses ALL types of changes, not just one category. This comprehensive approach ensures consistent and reliable delivery regardless of change type."
      },
      {
        q: "True or False: Continuous Delivery is similar to DevOps in that both require organizational transformation, not just technical changes.",
        options: ["True", "False"],
        answer: 0,
        explanation: "Both CD and DevOps require fundamental shifts in how organizations think about and approach software delivery, involving people, processes, and technology."
      }
    ]
  },
  {
    title: "Section 2: Problems CD Solves",
    points: 25,
    questions: [
      {
        q: "What is the primary goal of codifying the release process?",
        options: [
          "To eliminate all developers from the release process",
          "To free developers and operators from the toil of releases so they can focus on delivering value",
          "To reduce the cost of software licenses",
          "To make the code more complex"
        ],
        answer: 1,
        explanation: "The goal is not to eliminate people, but to free them from repetitive, low-value work so they can focus on solving business problems and creating value."
      },
      {
        q: "True or False: Continuous Delivery saves costs by eliminating the staff required to manage releases.",
        options: ["True", "False"],
        answer: 1,
        explanation: "This is a common misconception. The goal is NOT to eliminate staff but to free engineers from the toil of releases to focus on generating value and solving business problems."
      },
      {
        q: "How does Continuous Delivery improve visibility?",
        options: [
          "By adding more monitoring tools",
          "By making the steps from build to production clear and accessible",
          "By creating more documentation",
          "By hiring more project managers"
        ],
        answer: 1,
        explanation: "Codifying the release process makes all steps explicit and visible, helping identify bottlenecks and constraints to developer productivity."
      },
      {
        q: "What timeframe improvement can Continuous Delivery provide for getting changes to users?",
        options: [
          "From weeks/months to days/hours",
          "From days to weeks",
          "From hours to months",
          "No significant time improvement"
        ],
        answer: 0,
        explanation: "CD dramatically accelerates delivery by automating manual processes, allowing organizations to go from lengthy release cycles to rapid, frequent deployments."
      },
      {
        q: "How does Continuous Delivery help with scaling?",
        options: [
          "By requiring more qualified personnel",
          "Through improvements to the automated process that persist into the future",
          "By making the process more complex",
          "By reducing the number of deployments"
        ],
        answer: 1,
        explanation: "Unlike manual processes that require hiring and training more people, automated CD processes can be scaled through process improvements that remain valuable over time."
      }
    ]
  },
  {
    title: "Section 3: CI vs CD",
    points: 20,
    questions: [
      {
        q: "What is the relationship between Continuous Integration (CI) and Continuous Delivery (CD)?",
        options: [
          "They are completely unrelated",
          "CI is an essential prerequisite for CD",
          "CD must be implemented before CI",
          "They are the same thing"
        ],
        answer: 1,
        explanation: "While CI and CD are distinct practices, CI must be in place before CD can be effectively implemented. They are entangled but CI comes first."
      },
      {
        q: "Continuous Integration (CI) primarily focuses on:",
        options: [
          "Deploying to production",
          "Regularly merging code into a centralized branch and detecting issues early",
          "Managing infrastructure",
          "Writing documentation"
        ],
        answer: 1,
        explanation: "CI is about frequent integration and early detection of issues through automated testing and linting, providing quick feedback to developers."
      },
      {
        q: "What does Continuous Delivery (CD) do with tested and integrated code?",
        options: [
          "Archives it for future use",
          "Sends it back to developers",
          "Automates its deployment into an environment",
          "Deletes it"
        ],
        answer: 2,
        explanation: "CD takes the tested, integrated code from CI and automates the deployment process into various environments."
      },
      {
        q: "The build process can be considered CI if:",
        options: [
          "It runs after deployment",
          "Automated tests run against the build",
          "It never creates artifacts",
          "It only runs manually"
        ],
        answer: 1,
        explanation: "When automated tests run against a build, it's performing the integration testing function of CI. If the build happens as part of deployment, it's CD."
      }
    ]
  },
  {
    title: "Section 4: Continuous Deployment vs Continuous Delivery",
    points: 20,
    questions: [
      {
        q: "What is the main difference between Continuous Delivery and Continuous Deployment?",
        options: [
          "Continuous Deployment requires human approval for production releases",
          "Continuous Deployment automates the entire deployment lifecycle without human intervention",
          "They are exactly the same",
          "Continuous Delivery is newer than Continuous Deployment"
        ],
        answer: 1,
        explanation: "Continuous Delivery typically requires human approval for production, while Continuous Deployment is fully automated end-to-end without manual gates."
      },
      {
        q: "True or False: Continuous Deployment is an essential part of Continuous Delivery.",
        options: ["True", "False"],
        answer: 1,
        explanation: "Continuous Deployment is an advanced evolution of CD practices, but it is NOT essential. Many successful organizations practice CD with manual approval gates for production releases."
      },
      {
        q: "In Continuous Delivery, production releases typically:",
        options: [
          "Are fully automated without any gates",
          "Require human approval manually",
          "Never happen",
          "Only occur on weekends"
        ],
        answer: 1,
        explanation: "CD automates the deployment process but typically gates production releases with a manual approval step, unlike Continuous Deployment which is fully automated."
      },
      {
        q: "Continuous Deployment stops progression when:",
        options: [
          "A developer requests it",
          "Tests fail or problems are detected from telemetry",
          "It's the end of the day",
          "The code is too complex"
        ],
        answer: 1,
        explanation: "Continuous Deployment relies on automated checks (tests, monitoring, telemetry) to determine if deployment should continue or trigger a rollback."
      }
    ]
  },
  {
    title: "Section 5: Key Concepts and Best Practices",
    points: 15,
    questions: [
      {
        q: "True or False: Continuous Delivery depends heavily on qualified personnel following manual processes to deploy changes.",
        options: ["True", "False"],
        answer: 1,
        explanation: "This is the opposite of CD! CD focuses on AUTOMATING the release of code changes, not depending on qualified personnel following manual processes."
      },
      {
        q: "What does Continuous Delivery help organizations understand better?",
        options: [
          "Programming languages",
          "How environments are composed and how to reproduce them",
          "Employee satisfaction",
          "Marketing strategies"
        ],
        answer: 1,
        explanation: "By encompassing infrastructure and configuration, CD leads to better understanding of environments and the ability to easily reproduce them (Infrastructure as Code)."
      },
      {
        q: "Keeping lower environments as production-like as possible helps to:",
        options: [
          "Increase costs",
          "Reduce the risk of problems on release due to inconsistencies between environments",
          "Make development slower",
          "Confuse developers"
        ],
        answer: 1,
        explanation: "Environment parity reduces the \"works on my machine\" problem and catches environment-specific issues earlier in the pipeline."
      }
    ]
  }
];

let globalQIndex = 0;

function renderQuiz() {
  const container = document.getElementById('quiz');
  let html = '';
  globalQIndex = 0;

  sections.forEach((section, si) => {
    html += `<h2 class="section-title">${section.title} (${section.points} points)</h2>`;
    const pointsPerQ = section.points / section.questions.length;

    section.questions.forEach((q, qi) => {
      globalQIndex++;
      const qId = `q${si}_${qi}`;
      html += `<div class="question" id="${qId}_card">
        <div class="question-header">
          <span class="question-number">Question ${globalQIndex}</span>
          <span class="points">${pointsPerQ} points</span>
        </div>
        <p class="question-text">${q.q}</p>
        <ul class="options">`;

      q.options.forEach((opt, oi) => {
        html += `<li id="${qId}_opt${oi}" onclick="selectOption('${qId}', ${oi}, ${q.options.length})">
          <label><input type="radio" name="${qId}" value="${oi}"> ${opt}</label>
        </li>`;
      });

      html += `</ul>
        <div class="explanation" id="${qId}_exp">
          <strong>${q.options[q.answer]}</strong><br>${q.explanation}
        </div>
      </div>`;
    });
  });

  container.innerHTML = html;
}

function selectOption(qId, selected, total) {
  for (let i = 0; i < total; i++) {
    document.getElementById(`${qId}_opt${i}`).classList.remove('selected');
  }
  document.getElementById(`${qId}_opt${selected}`).classList.add('selected');
  document.querySelector(`input[name="${qId}"][value="${selected}"]`).checked = true;
}

function submitQuiz() {
  let totalScore = 0;
  let maxScore = 0;
  let sectionScores = [];
  let unanswered = 0;

  sections.forEach((section, si) => {
    const pointsPerQ = section.points / section.questions.length;
    let sectionScore = 0;
    maxScore += section.points;

    section.questions.forEach((q, qi) => {
      const qId = `q${si}_${qi}`;
      const card = document.getElementById(`${qId}_card`);
      const exp = document.getElementById(`${qId}_exp`);
      const selected = document.querySelector(`input[name="${qId}"]:checked`);

      card.classList.remove('correct', 'incorrect');
      exp.classList.remove('show', 'correct-exp', 'incorrect-exp');

      if (!selected) {
        unanswered++;
        card.classList.add('incorrect');
        exp.classList.add('show', 'incorrect-exp');
        return;
      }

      const val = parseInt(selected.value);
      if (val === q.answer) {
        sectionScore += pointsPerQ;
        card.classList.add('correct');
        exp.classList.add('show', 'correct-exp');
      } else {
        card.classList.add('incorrect');
        exp.classList.add('show', 'incorrect-exp');
      }
    });

    totalScore += sectionScore;
    sectionScores.push({ title: section.title, score: sectionScore, max: section.points });
  });

  if (unanswered > 0) {
    const warn = document.getElementById('unanswered');
    warn.textContent = `${unanswered} question(s) left unanswered (counted as incorrect).`;
    warn.classList.add('show');
  }

  showResults(totalScore, maxScore, sectionScores);
}

function showResults(score, max, sectionScores) {
  const pct = Math.round((score / max) * 100);
  let level, levelClass, desc;

  if (pct >= 90) {
    level = 'Expert'; levelClass = 'score-expert';
    desc = "Outstanding! You have excellent understanding of Continuous Delivery. You're ready to implement and champion CD practices in your organization.";
  } else if (pct >= 80) {
    level = 'Advanced'; levelClass = 'score-advanced';
    desc = 'Strong grasp of CD concepts. Review the areas where you missed questions to solidify your expertise.';
  } else if (pct >= 70) {
    level = 'Intermediate'; levelClass = 'score-intermediate';
    desc = 'Good foundation in CD principles. Consider deeper study of the topics you found challenging.';
  } else if (pct >= 60) {
    level = 'Basic'; levelClass = 'score-basic';
    desc = 'You understand the fundamentals but need more practice. Review the course materials and retake the quiz.';
  } else {
    level = 'Beginner'; levelClass = 'score-beginner';
    desc = "Take time to read through the Continuous Delivery introduction materials. Don't be discouraged — CD is a rich topic!";
  }

  let breakdownHTML = '';
  sectionScores.forEach(s => {
    const sPct = Math.round((s.score / s.max) * 100);
    breakdownHTML += `<div class="breakdown-row">
      <span class="section-name">${s.title.replace(/Section \d+: /, '')}</span>
      <span>${s.score}/${s.max} (${sPct}%)</span>
    </div>`;
  });

  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = `
    <div class="score-circle ${levelClass}">
      ${pct}%
      <span class="label">${score}/${max}</span>
    </div>
    <div class="level-title">${level}</div>
    <p class="level-desc">${desc}</p>
    <div class="progress-bar">
      <div class="progress-fill ${levelClass}" style="width: ${pct}%; background: currentColor;"></div>
    </div>
    <div class="breakdown">
      <h3>Score Breakdown</h3>
      ${breakdownHTML}
    </div>
  `;
  resultsDiv.classList.add('show');
  resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetQuiz() {
  document.getElementById('results').classList.remove('show');
  document.getElementById('results').innerHTML = '';
  document.getElementById('unanswered').classList.remove('show');
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuiz();
</script>
</body>
</html>
