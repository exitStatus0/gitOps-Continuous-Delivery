      },
      {
        q: "Так чи Ні: Бажаний стан системи з незмінними версіями повинен зберігатися декларативно, а програмний агент узгоджує фактичний стан з цим бажаним станом.",
        options: ["Так", "Ні"],
        answer: 0,
        explanation: "Це твердження точно узагальнює GitOps в одному реченні, поєднуючи ключові принципи: декларативне зберігання, незмінні версії та безперервне узгодження програмним агентом."
      }
    ]
  }
];

let globalQIndex = 0;

function renderQuiz() {
  const container = document.getElementById('quiz');
  let html = '';
  globalQIndex = 0;

  sections.forEach((section, si) => {
    html += `<h2 class="section-title">${section.title} (${section.points} балів)</h2>`;
    const pointsPerQ = section.points / section.questions.length;

    section.questions.forEach((q, qi) => {
      globalQIndex++;
      const qId = `q${si}_${qi}`;
      html += `<div class="question" id="${qId}_card">
        <div class="question-header">
          <span class="question-number">Питання ${globalQIndex}</span>
          <span class="points">${pointsPerQ} балів</span>
        </div>
        <p class="question-text">${q.q}</p>
        <ul class="options">`;

      q.options.forEach((opt, oi) => {
        html += `<li id="${qId}_opt${oi}" onclick="selectOption('${qId}', ${oi}, ${q.options.length})">
          <label><input type="radio" name="${qId}" value="${oi}"> ${opt}</label>
        </li>`;
      });

      html += `</ul>
        <div class="explanation" id="${qId}_exp">
          <strong>${q.options[q.answer]}</strong><br>${q.explanation}
        </div>
      </div>`;
    });
  });

  container.innerHTML = html;
}

function selectOption(qId, selected, total) {
  for (let i = 0; i < total; i++) {
    document.getElementById(`${qId}_opt${i}`).classList.remove('selected');
  }
  document.getElementById(`${qId}_opt${selected}`).classList.add('selected');
  document.querySelector(`input[name="${qId}"][value="${selected}"]`).checked = true;
}

function submitQuiz() {
  let totalScore = 0;
  let maxScore = 0;
  let sectionScores = [];
  let unanswered = 0;

  sections.forEach((section, si) => {
    const pointsPerQ = section.points / section.questions.length;
    let sectionScore = 0;
    maxScore += section.points;

    section.questions.forEach((q, qi) => {
      const qId = `q${si}_${qi}`;
      const card = document.getElementById(`${qId}_card`);
      const exp = document.getElementById(`${qId}_exp`);
      const selected = document.querySelector(`input[name="${qId}"]:checked`);

      card.classList.remove('correct', 'incorrect');
      exp.classList.remove('show', 'correct-exp', 'incorrect-exp');

      if (!selected) {
        unanswered++;
        card.classList.add('incorrect');
        exp.classList.add('show', 'incorrect-exp');
        return;
      }

      const val = parseInt(selected.value);
      if (val === q.answer) {
        sectionScore += pointsPerQ;
        card.classList.add('correct');
        exp.classList.add('show', 'correct-exp');
      } else {
        card.classList.add('incorrect');
        exp.classList.add('show', 'incorrect-exp');
      }
    });

    totalScore += sectionScore;
    sectionScores.push({ title: section.title, score: sectionScore, max: section.points });
  });

  if (unanswered > 0) {
    const warn = document.getElementById('unanswered');
    warn.textContent = `${unanswered} питань без відповіді (зараховані як неправильні).`;
    warn.classList.add('show');
  }

  showResults(totalScore, maxScore, sectionScores);
}

function showResults(score, max, sectionScores) {
  const pct = Math.round((score / max) * 100);
  let level, levelClass, desc;

  if (pct >= 90) {
    level = 'Експерт з GitOps'; levelClass = 'score-expert';
    desc = 'Виняткове розуміння! Ви готові очолювати ініціативи GitOps та наставляти інших у стратегіях впровадження.';
  } else if (pct >= 80) {
    level = 'Просунутий практик'; levelClass = 'score-advanced';
    desc = 'Сильне розуміння концепцій GitOps. Перегляньте області, в яких ви помилилися, щоб зміцнити свою експертизу.';
  } else if (pct >= 70) {
    level = 'Середній рівень'; levelClass = 'score-intermediate';
    desc = 'Солідна основа в принципах GitOps. Поглибіть свої знання в областях, де у вас виникли труднощі.';
  } else if (pct >= 60) {
    level = 'Новачок'; levelClass = 'score-basic';
    desc = 'Ви розумієте основи, але потрібно більше практики. Перегляньте матеріали курсу та пройдіть тест знову.';
  } else {
    level = 'Початківець'; levelClass = 'score-beginner';
    desc = 'Приділіть час ретельному прочитанню матеріалів з GitOps. Не хвилюйтеся — концепції GitOps потребують практики!';
  }

  let breakdownHTML = '';
  sectionScores.forEach(s => {
    const sPct = Math.round((s.score / s.max) * 100);
    breakdownHTML += `<div class="breakdown-row">
      <span class="section-name">${s.title.replace(/Розділ \d+: /, '')}</span>
      <span>${s.score}/${s.max} (${sPct}%)</span>
    </div>`;
  });

  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = `
    <div class="score-circle ${levelClass}">
      ${pct}%
      <span class="label">${score}/${max}</span>
    </div>
    <div class="level-title">${level}</div>
    <p class="level-desc">${desc}</p>
    <div class="progress-bar">
      <div class="progress-fill ${levelClass}" style="width: ${pct}%; background: currentColor;"></div>
    </div>
    <div class="breakdown">
      <h3>Результати по розділах</h3>
      ${breakdownHTML}
    </div>
  `;
  resultsDiv.classList.add('show');
  resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetQuiz() {
  document.getElementById('results').classList.remove('show');
  document.getElementById('results').innerHTML = '';
  document.getElementById('unanswered').classList.remove('show');
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuiz();
</script>
</body>
</html>
